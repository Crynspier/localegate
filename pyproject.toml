[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "locale-gate"
version = "0.1.0"
description = "Evidence-backed, deterministic locale-aware execution boundary for structured LLM tool calls (Croatian/EU & English reference implementation)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  { name = "LocaleGate Contributors" }
]
keywords = [
  "llm",
  "tool-calling",
  "locale",
  "croatian",
  "deterministic-validation",
  "agent-safety",
  "benchmark"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "babel>=2.16.0,<3.0.0",
  "tzdata>=2024.2",
  "typer>=0.12.5,<1.0.0",
  "rich>=13.8.0,<14.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn>=0.31.0,<1.0.0",
  "httpx>=0.27.2,<1.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "hypothesis>=6.112.0,<7.0.0",
  "ruff>=0.6.8,<1.0.0",
  "mypy>=1.11.2,<2.0.0",
  "types-PyYAML>=6.0.12",
  "httpx2>=2.16.0",
]

[project.scripts]
locale-gate = "locale_gate.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/locale_gate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["locale_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "model_integration: live local llama.cpp + Qwen3.5-4B GGUF integration tests",
]

[tool.coverage.run]
source = ["locale_gate"]
branch = true
omit = [
  "src/locale_gate/cli/*",
  "src/locale_gate/api/*",
]
